<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Communications Terminal</title>
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        .hidden-security-trap { display: none !important; visibility: hidden !important; opacity: 0 !important; }
    </style>
</head>
<body class="bg-slate-950 text-slate-400">
    <div class="max-w-4xl mx-auto p-6">
        <h1 class="text-3xl font-bold text-white mb-6">Contact</h1>
        
        <!-- Secure Contact Form -->
        <form action="https://formspree.io/f/xrenvajv" method="POST" id="commsForm" class="space-y-4">
            <!-- Honeypot Field -->
            <div class="hidden-security-trap">
                <input type="text" name="system_auth_token" tabindex="-1">
            </div>

            <input type="text" name="name" placeholder="Name" required class="w-full bg-slate-900 p-3 rounded">
            <input type="email" name="_replyto" placeholder="Email" required class="w-full bg-slate-900 p-3 rounded">
            <textarea name="message" placeholder="Message" required class="w-full bg-slate-900 p-3 rounded"></textarea>
            
            <button type="submit" class="bg-cyan-500 text-slate-950 px-6 py-2 rounded">Submit</button>
        </form>
    </div>

    <script>
        document.getElementById('commsForm').addEventListener('submit', function(e) {
            if (document.querySelector('[name="system_auth_token"]').value !== "") {
                e.preventDefault();
                return false;
            }
        });
    </script>
</body>
</html>
